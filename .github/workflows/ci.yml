name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on a known high-severity advisory in what ships (nodemailer had several; this is how it would be caught).
      - run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # A throwaway random secret: production start-up refuses placeholder secrets, and none should live in the repo.
      - run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm build
        env:
          APP_URL: http://localhost:3000
          ADMIN_EMAIL: ci@example.com
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t ambagan:ci .
      - name: Start it and wait for the health check
        run: |
          docker run -d --name ambagan -p 3000:3000 \
            -e AUTH_SECRET="$(openssl rand -base64 32)" \
            -e APP_URL=http://localhost:3000 \
            -e ADMIN_EMAIL=ci@example.com \
            -e SMTP_HOST=localhost -e SMTP_FROM_EMAIL=ci@example.com \
            ambagan:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then
              curl -sI http://localhost:3000/login | grep -i "content-security-policy:.*'nonce-"
              exit 0
            fi
            sleep 2
          done
          docker logs ambagan
          exit 1
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Builds the app, starts the standalone server and a local TLS SMTP sink, then walks the whole journey:
      # invite, sign in, statement, scan a receipt, pay, verify, emails.
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
